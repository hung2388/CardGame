<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CARDPUNK - Bàn Đấu Game Bài Trực Tuyến</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <!-- Mobile Landscape Orientation Helper Modal -->
  <div id="orientation-overlay" class="orientation-overlay">
    <div class="orientation-modal nb-box">
      <div class="phone-rotate-anim">
        <div class="phone-device">
          <div class="phone-screen">
            <span class="phone-card-symbol">🃏</span>
          </div>
        </div>
        <div class="rotate-glow-circle"></div>
      </div>
      <h2 class="orientation-title">XOAY NGANG ĐIỆN THOẠI</h2>
      <p class="orientation-desc">
        Bàn đấu sẽ tự động mở rộng toàn màn hình, hiển thị đầy đủ tất cả lá bài trên tay và vị trí các người chơi!
      </p>
      <div class="orientation-actions">
        <button id="btn-force-landscape" class="nb-btn yellow lg">
          🔄 Bật Toàn Màn Hình & Xoay Ngang
        </button>
        <button id="btn-dismiss-orientation" class="nb-btn white sm">
          Tiếp tục xem dọc
        </button>
      </div>
    </div>
  </div>

  <!-- Spinner Overlay Modal (Synchronized Wheel Animation) -->
  <div id="spinner-overlay" class="spinner-overlay"></div>

  <div class="game-arena-wrapper">
    <!-- Top Header -->
    <header class="arena-header">
      <div class="arena-title-box">
        <a href="lobby.html" class="nb-btn white sm" title="Rời bàn về sảnh">← Rời Phòng</a>
        <div class="room-chip">
          <span>PHÒNG:</span>
          <span id="room-id-display">------</span>
          <button class="nb-btn sm yellow" style="padding: 2px 8px; font-size: 11px;" onclick="copyRoomLink()">Copy Link</button>
        </div>
        <div class="nb-badge" id="game-title-display" style="background: var(--color-cyan);">Ba Cào (3 Lá)</div>
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <button id="btn-toggle-fullscreen" class="nb-btn sm white" title="Chế độ toàn màn hình ngang" onclick="toggleLandscapeMode()">
          ⛶ Xoay Ngang
        </button>
        <button id="btn-start-game" class="nb-btn green sm" style="display: none;">
          Bắt Đầu Ván
        </button>
      </div>
    </header>

    <!-- Table Stage -->
    <main class="table-stage-container">
      <!-- Oval Felt Poker Table -->
      <div id="poker-oval-table" class="poker-oval-table">
        <!-- Player Seats Layer (Circular clockwise, viewer at 3 o'clock) -->
        <div id="table-seats-layer" class="table-seats-layer"></div>

        <!-- Center Elements: Deck and Played Cards -->
        <div class="table-center-content">
          <div id="table-deck-layer" class="table-deck-layer"></div>
          <div id="table-center-cards" class="table-center-cards"></div>
        </div>
      </div>
    </main>

    <!-- Player Bottom Hand & Actions Console -->
    <footer class="arena-hand-console">
      <div id="turn-status-banner" class="turn-banner waiting">
        Đang đồng bộ bàn đấu...
      </div>

      <div class="hand-content-row">
        <!-- My Hand Cards (Only I can see) -->
        <div id="my-hand-cards" class="my-hand-cards"></div>

        <!-- Action Buttons -->
        <div class="hand-action-buttons">
          <button id="btn-play-cards" class="nb-btn pink lg" disabled>
            Đánh Bài
          </button>
          <button id="btn-pass-turn" class="nb-btn white sm" disabled>
            Bỏ Lượt
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/socket-client.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/card-renderer.js"></script>
  <script src="js/spinner.js"></script>
  <script src="js/games/three-cards.js"></script>
  <script src="js/games/sam.js"></script>
  <script src="js/games/tan.js"></script>
  <script src="js/games/uno.js"></script>
  <script src="js/games/exploding-kittens.js"></script>
  <script src="js/game-table.js"></script>

  <script>
    function copyRoomLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        alert('Đã sao chép link mời phòng! Gửi link cho bạn bè để cùng chơi.');
      });
    }

    // Toggle and enforce mobile landscape orientation
    async function toggleLandscapeMode() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          } else if (document.documentElement.webkitRequestFullscreen) {
            await document.documentElement.webkitRequestFullscreen();
          }
        }
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (e) {
        console.warn('Orientation request:', e);
      }
    }

    function initOrientationSupport() {
      const overlay = document.getElementById('orientation-overlay');
      const btnForce = document.getElementById('btn-force-landscape');
      const btnDismiss = document.getElementById('btn-dismiss-orientation');

      if (btnForce) {
        btnForce.addEventListener('click', async () => {
          await toggleLandscapeMode();
          document.body.classList.add('dismiss-orientation');
          if (overlay) overlay.style.display = 'none';
        });
      }

      if (btnDismiss) {
        btnDismiss.addEventListener('click', () => {
          document.body.classList.add('dismiss-orientation');
          if (overlay) overlay.style.display = 'none';
        });
      }

      function evaluateOrientation() {
        const isPortrait = window.matchMedia('(orientation: portrait)').matches;
        const isMobile = window.innerWidth <= 900 || window.innerHeight <= 550 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        if (!isPortrait) {
          if (overlay) overlay.style.display = 'none';
        } else if (isMobile && !document.body.classList.contains('dismiss-orientation')) {
          if (overlay) overlay.style.display = 'flex';
        }
      }

      window.addEventListener('resize', evaluateOrientation);
      window.addEventListener('orientationchange', evaluateOrientation);
      evaluateOrientation();

      // Attempt orientation lock on first touch gesture on mobile
      const onInitialTouch = async () => {
        window.removeEventListener('touchstart', onInitialTouch);
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock('landscape');
          } catch (e) {}
        }
      };
      window.addEventListener('touchstart', onInitialTouch, { passive: true, once: true });
    }

    // Auto join on page load if params present
    window.addEventListener('DOMContentLoaded', () => {
      initOrientationSupport();

      const table = new GameTable();
      window.gameTableInstance = table;

      window.cardpunkClient.init();

      const params = new URLSearchParams(window.location.search);
      let roomId = params.get('room');
      let playerName = params.get('name') || sessionStorage.getItem('cardpunk_player_name');
      let isCreate = params.get('create') === 'true';
      const gameType = params.get('game') || 'three-cards';

      if (!playerName) {
        playerName = prompt('Nhập tên của bạn để vào bàn:', 'Chiến Binh ' + Math.floor(Math.random() * 100));
        if (!playerName) playerName = 'Người Chơi ' + Math.floor(Math.random() * 100);
        sessionStorage.setItem('cardpunk_player_name', playerName);
      }

      window.cardpunkClient.on('connect', () => {
        if (isCreate) {
          window.cardpunkClient.createRoom(gameType, playerName).then((res) => {
            if (res.success) {
              roomId = res.roomId;
              isCreate = false; // Next reconnect will rejoin existing room
              const newUrl = `${window.location.pathname}?room=${res.roomId}&name=${encodeURIComponent(playerName)}`;
              window.history.replaceState(null, '', newUrl);
              table.updateState(res.state);

              // Notify parent window (e.g. test workbench)
              try {
                if (window.parent && window.parent !== window) {
                  window.parent.postMessage({ type: 'room_created', roomId: res.roomId, gameType: res.state?.gameType || gameType }, '*');
                }
              } catch (e) {}
            } else {
              alert('Lỗi tạo phòng: ' + res.error);
            }
          });
        } else if (roomId) {
          window.cardpunkClient.joinRoom(roomId, playerName).then((res) => {
            if (res.success) {
              table.updateState(res.state);
            } else {
              alert('Lỗi vào phòng: ' + res.error);
              window.location.href = 'lobby.html';
            }
          });
        } else {
          // No room specified, redirect to lobby
          window.location.href = 'lobby.html';
        }
      });
    });
  </script>
</body>
</html>
